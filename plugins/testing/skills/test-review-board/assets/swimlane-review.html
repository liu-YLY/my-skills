<script>
'use strict';
const data = JSON.parse(document.getElementById('review-data').textContent);
const $ = id => document.getElementById(id);
const mode = data.view || (data.lanes.length > 1 ? 'swimlane' : 'flow');
const rulesMode = mode === 'rules', stateMode = mode === 'state', swimlane = mode === 'swimlane';
const businessTitle = {swimlane:'业务泳道图',flow:'业务流程图',state:'业务状态图',rules:'业务规则表'}[mode];
const board = document.querySelector('.board');
const smallScreen = matchMedia('(max-width:780px)');
const paneButtons = [...document.querySelectorAll('#mobile-views button')];
function showPane(pane){
  board.dataset.mobilePane=pane;
  for(const button of paneButtons)button.setAttribute('aria-pressed',String(button.dataset.pane===pane));
}
for(const button of paneButtons)button.addEventListener('click',()=>showPane(button.dataset.pane));
document.body.classList.add('review-mode-'+mode);
board.classList.toggle('rule-table-mode',rulesMode);
$('mobile-views').hidden=rulesMode;$('flow').hidden=rulesMode;$('rules-board').hidden=!rulesMode;
$('business-tab').textContent=businessTitle;$('graph-title').textContent=businessTitle;
$('view').setAttribute('aria-label',businessTitle+'，F 切换视图');
if(stateMode){$('main-line').textContent='状态转移';$('alt-line').textContent='拒绝或恢复';}
const stageMap = new Map(data.stages.map(s=>[s.id,s]));
const nodeMap = new Map(data.nodes.map(n=>[n.id,n]));
for(const point of data.points)point.nodes??=[];
const pointMap = new Map(data.points.map(p=>[p.id,p]));
const ruleMap = new Map((data.rules || []).map(r=>[r.id,r]));
const transitionMap = new Map(stateMode?data.edges.map(edge=>[edge.id,edge]):[]);
const anchorMap = rulesMode?ruleMap:transitionMap;
const anchorPrefix = rulesMode?'r-':'t-';
const anchorLabel = rulesMode?'规则':'转移';
const traceLabel = rulesMode?'定位规则':stateMode?'定位状态图':'定位流程';
const anchorField = rulesMode?'rule_ids':'transition_ids';
function anchorsOf(p,c){
  if(c?.[anchorField])return c[anchorField];
  return [...anchorMap.values()].filter(row=>row.point_ids?.includes(p?.id)).map(row=>row.id);
}
const orphanGroup={id:'__unmapped__',title:'未映射用例',nodes:[],rule:[],context:[],reminders:[],cases:data.orphan_cases||[]};
function resolvePoint(id){return id===orphanGroup.id?orphanGroup:pointMap.get(id);}
const caseMap = new Map([...data.points,orphanGroup].flatMap(p=>p.cases.map(c=>[c.id,{p,c}])));
const boxes = new Map(), links = new Map(), lines = [];
const svgNS='http://www.w3.org/2000/svg';
function el(tag,cl,text) {
  const e=document.createElement(tag);
  if(cl)e.className=cl;
  if(text!=null)e.textContent=text;
  return e;
}
function svg(tag,attrs,text) {
  const e=document.createElementNS(svgNS,tag);
  for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);
  if(text!=null)e.textContent=text;
  return e;
}
function lineLink(id,label,url) { const a=$(id); if(url){a.textContent=label;a.href=url;}else a.hidden=true; }
for(const id of ['title','context','intro','status','scope','provenance'])$(id).textContent=data[id];
lineLink('source',data.sourceLabel,data.source);lineLink('peer',data.peerLabel,data.peer);lineLink('md',data.mdLabel,data.md);
const deferred=[...caseMap.values()].filter(x=>x.c.deferred).length;
$('summary-count').textContent=(rulesMode?ruleMap.size+' 条规则':data.stages.length+' 个环节')+' · '+data.points.length+' 个测试点 · '+caseMap.size+' 条用例记录'+(deferred?'（含 '+deferred+' 条待删除）':'');
$('drawer-foot').textContent='点标题展开或收起。'+traceLabel+'可查看关联位置。Esc 返回测试点。';
const factLabels = {documented:'资料事实',inferred:'推断',pending:'待确认',confirmed:'已确认'};
const sourceMap = new Map((data.sources || []).map(s=>[s.id,s]));
function evidence(record) {
  const area=el('div','evidence');
  if(record.changed)area.append(el('span','fact changed','本期变化'));
  if(record.fact_status)area.append(el('span','fact '+record.fact_status,factLabels[record.fact_status]));
  for(const id of record.source_ids || []){
    const source=sourceMap.get(id);
    if(!source)continue;
    const a=el('a','source-link',source.title);a.href='#source-'+id;
    a.addEventListener('click',event=>{
      if(event.ctrlKey||event.metaKey||event.altKey||event.shiftKey)return;
      event.preventDefault();
      $('source-title').textContent=source.title;
      $('source-location').textContent=source.location;
      const documentLink=$('source-document');
      documentLink.removeAttribute('href');
      if(source.url){
        try{
          const url=new URL(source.url,location.href);
          if(['http:','https:','file:'].includes(url.protocol))documentLink.setAttribute('href',source.url);
        }catch{}
      }
      documentLink.hidden=!documentLink.hasAttribute('href');
      $('source-dialog').showModal();
    });
    area.append(a);
  }
  return area;
}
function coverageGaps(){
  const gaps=[];
  const add=(kind,id,text,target)=>gaps.push({kind,id,text,target});
  const linked=new Set(data.points.flatMap(p=>p.nodes));
  const incident=new Set(data.edges.flatMap(e=>[e.a,e.b]));

  if(!c.deferred)content.append(caseField('前置条件',c.pre),caseField('测试步骤',c.steps,c.summary?'业务操作摘要':''),caseField('预期结果',c.expected));
  if(c.original_case){
    const original=el('details','case-original');
    original.append(el('summary','',c.deferred?'原始用例内容':'完整原始字段'),el('pre','',JSON.stringify(c.original_case,null,2)));
    content.append(original);
  }
  card.append(head,content);
  card.open=open;
  const point=caseMap.get(c.id).p, associated=c.nodes||point.nodes;
  const anchors=anchorsOf(point,c), scoped=selectedScope.slice(2);
  const anchor=selectedScope.startsWith(anchorPrefix)&&anchors.includes(scoped)?scoped:anchors[0];
  const canTrace=Boolean(anchor||associated.length);
  const trace=el(canTrace?'a':'span','case-trace',canTrace?traceLabel+' ↰':'关联待确认');
  if(canTrace)trace.href=href('flow-c-'+c.id,anchor?anchorPrefix+anchor:null);
  trace.setAttribute('aria-label',c.title+'，'+(canTrace?traceLabel:'关联待确认'));
  shell.append(card,trace);

}
function keepVisible(container,item,alignTop=false){
  if(!item)return;
  const r=item.getBoundingClientRect(), v=container.getBoundingClientRect();
  if(alignTop||r.top<v.top||r.bottom>v.bottom)container.scrollTop+=r.top-v.top-6;
}
function showGroup(p,items,exactCase,fromFlow,back,move) {
  const opening=drawer.hidden, changed=drawerPoint?.id!==p.id||drawerScope!==selectedScope;
  if(opening){
    const trigger=$('open-'+p.id),list=$('scroll');
    openOrigin={point:p.id,scope:selectedScope,top:list.scrollTop,y:window.scrollY,
      offset:trigger?trigger.getBoundingClientRect().top-list.getBoundingClientRect().top:0,
      fromList:Boolean(trigger)&&!$('points-view').hidden&&overviewScope===selectedScope};
  }
  if(changed){
    rememberGroup();
    drawerPoint=p;drawerScope=selectedScope;
    $('drawer-title').textContent=p.id+' · '+p.title;
    const cases=casesForPoint(p), archivedCases=cases.filter(c=>c.deferred);
    const archived=archivedCases.length;
    $('drawer-warning').hidden=archived===0;
    $('drawer-warning').textContent=archived?'待删除，不参与执行：'+archivedCases.map(c=>c.id).join('、'):'';
    $('drawer-count').textContent='当前范围 '+cases.length+' 条用例'+(archived?' · 含 '+archived+' 条待删除':'');
    $('all-point-cases').hidden=cases.length===p.cases.length;
    $('all-point-cases').href='#cases-'+p.id;
    const wasOpen=savedDisclosure.get(p.id);
    drawerBody.replaceChildren(...cases.map(c=>caseCard(c,wasOpen?.get(c.id)??(cases.length===1))));
    if(!cases.length)drawerBody.append(note('待补充用例',['当前范围尚无用例，可以先评审规则和待确认事项。']));
    drawerBody.scrollTop=0;
  }
  drawerItems=items;
  const index=items.indexOf(p);
  $('previous-point').disabled=index<=0;$('next-point').disabled=index<0||index===items.length-1;
  $('points-view').hidden=true;drawer.hidden=false;
  for(const shell of drawerBody.children)shell.classList.remove('current-case');
  if(exactCase){
    const head=$('head-'+exactCase.id);
    head.parentElement.open=true;head.closest('.case-shell').classList.add('current-case');
    if(changed||!back||opening)keepVisible(drawerBody,head,true);
    if(!back && (move||fromFlow))head.focus({preventScroll:true});
  }else if(opening&&move)$('back-points').focus({preventScroll:true});
  updateDisclosureButton();
}
function showPoints(p,scope,back,move) {
  const closing=!drawer.hidden;
  const scopeChanged=overviewScope!==selectedScope;
  const top=scopeChanged?0:$('scroll').scrollTop;
  if(closing){
    rememberGroup();drawerPoint=null;drawerScope=null;drawerItems=[];
  }
  drawer.hidden=true;$('points-view').hidden=false;
  $('scope-note').textContent=scope.label;
  $('scope-note').parentElement.hidden=!scope.label;
  const records=scope.items.reduce((sum,item)=>sum+casesForPoint(item).length,0);
  $('counts').textContent=[scope.title, scope.items.length+' 个测试点',records+' 条用例记录'].filter(Boolean).join(' · ');
  const host=$('reading');host.replaceChildren();overviewScope=selectedScope;
  const firstSources=scope.items[0]?.source_ids||[];
  const sharedSource=scope.items.length>1 && firstSources.length===1 &&
    scope.items.every(item=>item.source_ids?.length===1&&item.source_ids[0]===firstSources[0]);
  for(const item of scope.items){
    const current=item===p, row=el('article','point-entry'+(current?' selected-point':''));
    row.id='entry-'+item.id;
    const line=el('div','point-entry-top'),name=el('div','');
    const link=el('a','point-title',item.title);link.href=href('p-'+item.id);
    link.title='查看测试点规则';
    name.append(el('code','point-label',item.id),link);
    const cases=casesForPoint(item);
    const action=el('a','view-cases',cases.length?'查看用例 · '+cases.length+' 条':'查看待补项');
    action.id='open-'+item.id;action.href=href('cases-'+item.id);
    if(cases.length)action.setAttribute('aria-label','查看'+item.title+'的 '+cases.length+' 条用例');
    line.append(name,action);row.append(line);
    if(current||item.changed||item.fact_status)row.append(evidence(sharedSource&&!current?{...item,source_ids:[]}:item));
    if(!cases.some(c=>!c.deferred))row.append(el('p','gap-inline','待补充用例'));
    if(!item.nodes.length&&!anchorsOf(item).length&&item!==orphanGroup)row.append(el('p','gap-inline',item.unmapped_reason||(rulesMode||stateMode?anchorLabel:'流程')+'关联待确认'));
    if(current){
      if(anchorsOf(item).length)row.append(anchorChips(item));
      if(item.nodes.length)row.append(nodeChips(item.nodes,'flow-p-'+item.id));
      for(const msg of item.rule){
        row.append(el('p','rule-text',typeof msg==='string'?msg:msg.text));
        if(typeof msg==='object')row.append(evidence(msg));
      }
      if(item.context.length||item.reminders.length)row.append(note('原稿评审口径',[...item.context,...item.reminders]));
    }
    host.append(row);
  }
  if(!p){
    const n=scope.node?nodeMap.get(scope.node):null;
    const reason=(n||scope.anchor)?.no_test_reason;
    host.append(el('p','gap-inline',reason?'无需独立测试点 · '+reason:'当前范围暂无关联测试点。'));
  }
  const restore=closing&&openOrigin?.fromList&&openOrigin.point===p?.id&&openOrigin.scope===selectedScope;
  $('scroll').scrollTop=restore?openOrigin.top:top;
  if(p&&!back){
    const action=$('open-'+p.id);
    if(restore){
      const list=$('scroll');
      list.scrollTop+=action.getBoundingClientRect().top-list.getBoundingClientRect().top-openOrigin.offset;
    }else keepVisible($('scroll'),action);
    if(closing&&move){
      action.focus({preventScroll:true});
      if(restore)window.scrollTo({top:openOrigin.y,behavior:'instant'});
      else if(matchMedia('(max-width:780px)').matches)$('reader').scrollIntoView({block:'start'});
    }
  }
  if(closing)openOrigin=null;
}
function closeGroup() {
  if(drawerPoint)location.hash=href('p-'+drawerPoint.id);
}
$('back-points').addEventListener('click',closeGroup);
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&!$('source-dialog').open&&!event.defaultPrevented&&!drawer.hidden){
    event.preventDefault();closeGroup();
  }
});
for(const [control,delta] of [['previous-point',-1],['next-point',1]]){
  $(control).addEventListener('click',()=>{
    const index=drawerItems.indexOf(drawerPoint),next=drawerItems[index+delta];
    if(next)location.hash=href('cases-'+next.id);
  });
}
$('toggle-cases').addEventListener('click',()=>{
  const expand=!drawerBody.querySelector('.case-card[open]');
  for(const card of drawerBody.querySelectorAll('.case-card'))card.open=expand;
  updateDisclosureButton();
});
drawerBody.addEventListener('toggle',updateDisclosureButton,true);

function render(move=false){
 const {key,context,preferred}=unpack(),back=key.startsWith('flow-'),detail=back?key.slice(5):key;
 const choose=detail.startsWith('c-')?caseMap.get(detail.slice(2)):null;
 const group=detail.startsWith('cases-')?resolvePoint(detail.slice(6)):null;
 const explicit=choose?.p || group || (detail.startsWith('p-')?resolvePoint(detail.slice(2)):null);
 const directAnchor=detail.startsWith(anchorPrefix)&&anchorMap.has(detail.slice(2));
 selectedScope=/^[sn]-/.test(detail)||directAnchor||['all','unmapped'].includes(detail)?detail:context;
 let scope=scopeInfo(selectedScope);
 if(explicit&&(!scope.items.includes(explicit)||(choose&&!casesForPoint(explicit).includes(choose.c)))){
   selectedScope=explicit===orphanGroup?'unmapped':'all';scope=scopeInfo(selectedScope);
 }
 const p=explicit||scope.items[0];
 for(const [id,a] of scopeAnchors){if(id===scope.stage)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');}
 const cameFromFlow=previousRoute.startsWith('flow-')&&!back;
 previousRoute=key;
 const wasOpen=!drawer.hidden;
 const onMobile=smallScreen.matches;
 if(!rulesMode){
   if(back)showPane('business');
   else if(choose||group||explicit||(move&&(directAnchor||detail.startsWith('n-')||detail==='unmapped')))showPane('reader');
   else if(!move||detail.startsWith('s-')||detail==='all')showPane('business');
 }
 if(p&&(group||choose))showGroup(p,scope.items,choose?.c,cameFromFlow,back,move);
 else showPoints(p,scope,back,move);
 const matches=anchorsOf(p,choose?.c);
 const pinnedAnchor=back&&preferred?.startsWith(anchorPrefix)&&matches.includes(preferred.slice(2))?preferred.slice(2):null;
 const anchor=anchorMap.get(pinnedAnchor) || scope.anchor || (back||explicit?anchorMap.get(matches[0]):null);
 if(rulesMode){
   $('rule-rows').querySelector('.rule-return')?.remove();
   for(const [id,row] of ruleRows){
     row.hidden=!anchor && scope.stage && !['all','unmapped'].includes(scope.stage) && ruleMap.get(id).stage!==scope.stage;
     row.classList.toggle('selected-rule',anchor?.id===id);
   }
   const summary=$('rule-count');
   const count=[...ruleRows.values()].filter(row=>!row.hidden).length;
   summary.textContent=count===ruleMap.size?'':count+' 条规则';
   if(back&&anchor){
     const a=el('a','small-link rule-return',choose?'返回当前用例':'返回当前测试点');
     a.href=href(detail);
     const row=ruleRows.get(anchor.id);row.querySelector('.rule-actions').append(a);
     row.scrollIntoView({block:'nearest'});a.focus({preventScroll:true});
   }else if(move&&(directAnchor||cameFromFlow||group||choose)){
     $('reader').scrollIntoView({block:'start'});
     if(directAnchor)$('open-'+p?.id)?.focus({preventScroll:true});
   }
   return;
 }
 const associated=p?(choose?.c.nodes||p.nodes):[];
 currentHighlight=anchor?[...new Set([anchor.a,anchor.b,...(explicit?associated:[])])]:explicit?[...associated]:(scope.node?[...new Set([scope.node,...(usedNodes.get(scope.node).length&&p?p.nodes:[])])]:[]);
 if(preferred&&currentHighlight.includes(preferred))currentHighlight=[preferred,...currentHighlight.filter(id=>id!==preferred)];
 const stageId=(scope.stage&&scope.stage!=='all')?scope.stage:p?.stage;
 const stagePoints=stageId?data.points.filter(item=>item.stage===stageId):[];
 const stageNodes=new Set(stageId ? [...stagePoints.flatMap(item=>item.nodes),...data.nodes.filter(n=>n.source===stageId).map(n=>n.id)] : []);
 for(const point of stagePoints)for(const id of anchorsOf(point)){
   const edge=transitionMap.get(id);stageNodes.add(edge.a);stageNodes.add(edge.b);
 }
 const isStage=!currentHighlight.length && scope.stage && scope.stage!=='all';
 const trace=pointContext(currentHighlight);
 graph.classList.toggle('point-focus',currentHighlight.length>0);
 graph.classList.toggle('stage-focus',Boolean(isStage));
 const nearby=[...trace.neighbors];
 for(const [id,a] of links){
   a.classList.toggle('in-stage',stageNodes.has(id));
   a.classList.toggle('via',trace.via.has(id)&&!currentHighlight.includes(id));
   a.classList.toggle('near',trace.neighbors.has(id));
   a.classList.remove('hover-step');
   const active=currentHighlight.includes(id);
   a.classList.toggle('selected',active);
   a.setAttribute('href',back&&active?href(detail):'#n-'+id);
 }
 for(const {edge,path,caption,target} of lines){
   if(target)target.setAttribute('href',back&&anchor===edge?href(detail):'#t-'+edge.id);
   for(const item of [path,caption]){
     item.classList.toggle('path-on',anchor?edge===anchor:trace.path.has(edge));
     item.classList.toggle('context-on',trace.contextEdges.has(edge));
   }
 }
 document.querySelectorAll('.graph-legend .key,.graph-legend .route,.graph-legend .nearby').forEach(e=>e.hidden=!currentHighlight.length);
 activeId=currentHighlight[0] || (isStage?data.nodes.find(n=>stageNodes.has(n.id))?.id:null);
 frameIds=currentHighlight.length?[...new Set([...currentHighlight,...trace.via,...nearby])]:(isStage?[...stageNodes]:[]);
 const locationLabel=id=>stateMode?nodeMap.get(id).title:'第 '+stepNumbers.get(id)+' 步 '+nodeMap.get(id).title;
 $('graph-info').textContent=anchor?nodeMap.get(anchor.a).title+' → '+nodeMap.get(anchor.b).title+' · '+anchor.label:
   currentHighlight.length?'当前定位　'+currentHighlight.map(locationLabel).join('、'):
   stateMode?'点击状态或转移条件查看测试点，按 F 切换视图。':'点击节点查看测试点，按 F 切换视图。';
 const evidencePanel=$('node-evidence');evidencePanel.replaceChildren();
 const focusNode=scope.node||currentHighlight[0];
 const focused=anchor||nodeMap.get(focusNode);
 if(focused&&(focused.source_ids?.length||focused.fact_status||focused.no_test_reason)){
   evidencePanel.append(el('strong','',focused.title||focused.label),evidence(focused));
   if(focused.no_test_reason)evidencePanel.append(el('p','', '无需独立测试点 · '+focused.no_test_reason));
 }
 evidencePanel.hidden=!evidencePanel.childElementCount;

 fitGraph();
 updateCamera(move);
 if(move&&back&&activeId){
   (anchor?$('transition-'+anchor.id):links.get(activeId)).focus({preventScroll:true});
   const rect=view.getBoundingClientRect();
   if(rect.top<45||rect.bottom>window.innerHeight)$('flow').scrollIntoView({block:'start'});
 } else if(move&&cameFromFlow){
   if(!choose&&p)$('open-'+p.id)?.focus({preventScroll:true});
   if(onMobile)$('reader').scrollIntoView({block:'start'});
 } else if(move&&onMobile&&board.dataset.mobilePane==='reader'&&!wasOpen)$('reader').scrollIntoView({block:'start'});
 else if(move&&!wasOpen&&!onMobile&&$('reader').getBoundingClientRect().bottom<0)$('reader').scrollIntoView({block:'start'});
}
document.querySelector('main').addEventListener('click',event=>{
 if(event.defaultPrevented||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
 const address=event.target.closest('a')?.getAttribute('href');
 if(address?.startsWith('#') && address===location.hash){
   event.preventDefault();render(true);

});
window.addEventListener('hashchange',()=>render(true));
render(Boolean(location.hash));

</script></body></html>
